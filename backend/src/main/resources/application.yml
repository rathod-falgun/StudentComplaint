spring:
  application:
    name: ComplaintApp
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: jdbc:mysql://${AIVEN_HOST}:${AIVEN_PORT}/${AIVEN_DB}?sslmode=required
    username: ${AIVEN_USERNAME}
    password: ${AIVEN_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      page-serialization-mode: via_dto

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:10000}

app:
  college:
    allowed-email-domain: scet.ac.in,gmail.com
  jwt:
    secret: ${JWT_SECRET_KEY}
  supabase:
    url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    buckets:
      profiles: profiles
      complaints: complaints
  email:
    brevo-api-key: ${BREVO_API_KEY:}
    brevo-from-email: ${BREVO_FROM_EMAIL:${EMAIL_USERNAME:studentcoder131@gmail.com}}
    resend-api-key: ${RESEND_API_KEY:}
    resend-from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
