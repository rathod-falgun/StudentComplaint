spring:
  application:
    name: ComplaintApp
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:mysql://${AIVEN_HOST}:${AIVEN_PORT}/${AIVEN_DB}?sslmode=required
    username: ${AIVEN_USERNAME}
    password: ${AIVEN_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      page-serialization-mode: via_dto
        
        

  server:
    address: 0.0.0.0
    port: ${SERVER_PORT}

app:
  college:
    allowed-email-domain: scet.ac.in
  jwt:
    secret: ${JWT_SECRET_KEY}
  supabase:
    url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    buckets:
      profiles: profiles
      complaints: complaints